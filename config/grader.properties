# Example defaults. The configuration loader is not implemented yet.
execution.timeout.seconds=5
# Space-separated JVM options for student programs: cap memory and block GUI windows.
execution.jvmOptions=-Xmx256m -Djava.awt.headless=true
compilation.timeout.seconds=30
# Maximum bytes kept from each of stdout/stderr per process; protects against infinite print loops.
process.maxOutputBytes=1000000
submissions.directory=submissions
assessment.directory=assessment
workspace.directory=workspace
output.directory=output
