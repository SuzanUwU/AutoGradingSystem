# Proposed initial sample-exam settings; not yet read by the application.
assessment.name=IS442-Sample-Exam
questions=Q1a,Q1b,Q2a,Q2b,Q3
Q1a.maxMarks=3
Q1b.maxMarks=3
Q2a.maxMarks=5
Q2b.maxMarks=5
Q3.maxMarks=4
Q1a.tester=Q1aTester
Q1b.tester=Q1bTester
Q2a.tester=Q2aTester
Q2b.tester=Q2bTester
Q3.tester=Q3Tester
# Submission folder holding each question part; trusted files live in assessment/resources/<folder>.
Q1a.folder=Q1
Q1b.folder=Q1
Q2a.folder=Q2
Q2b.folder=Q2
Q3.folder=Q3
# Student source files that must exist before compiling (comma-separated). Helpers such as
# ShapeComparator.java are left out: javac reports them if the student's code actually needs them.
Q1a.requiredSources=Q1a.java
Q1b.requiredSources=Q1b.java
Q2a.requiredSources=Q2a.java
Q2b.requiredSources=Q2b.java
Q3.requiredSources=Q3.java
